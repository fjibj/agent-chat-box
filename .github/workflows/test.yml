name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # packages/web and packages/server keep their own lockfiles (no npm workspaces yet),
      # so their deps (tailwind, react-router-dom, js-yaml, ...) must be installed too.
      - run: npm ci
        working-directory: packages/web
      - run: npm ci
        working-directory: packages/server
      # typecheck covers packages/*/src (server, shared, daemon) + packages/web
      - run: npm run typecheck
      - run: npm run lint
      # All three suites: root 76 + server 325 + web 54 = 455 cases
      - run: npm test
      - run: npm run test:coverage
      - run: npm run quality:gates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            packages/server/coverage/
            packages/web/coverage/
          if-no-files-found: ignore

  e2e-test:
    runs-on: ubuntu-latest
    env:
      # The repo-local Playwright browser instead of the system Edge used for local dev.
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: packages/web
      - run: npx playwright install --with-deps chromium
      # The E2E harness boots the central server, which serves packages/web/dist —
      # so the Web UI has to be built (this also gates `tsc` on the web package).
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
